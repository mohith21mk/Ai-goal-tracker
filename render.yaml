services:
  # Backend API Web Service
  - type: web
    name: mkc-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: python -m pip install --upgrade pip && pip install --no-cache-dir --retries 5 --timeout 60 -r requirements.txt && python -m alembic upgrade head
    startCommand: gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mkc-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "none"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

databases:
  # Managed PostgreSQL Database
  - name: mkc-db
    plan: free
    databaseName: mkc_db
    user: mkc_user
