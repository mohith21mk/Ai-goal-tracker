services:
  # Backend API Web Service
  - type: web
    name: mkc-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: singapore
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mkc-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: mkc-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: mkc-frontend
          property: url
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: mkc-frontend
          property: url

  # Frontend Static Site
  - type: web
    name: mkc-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    region: singapore
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mkc-backend
          property: url

  # Redis Instance (Pub/Sub & WebSocket event broker)
  - type: redis
    name: mkc-redis
    region: singapore
    plan: starter
    ipAllowList: []

databases:
  # Managed PostgreSQL Database
  - name: mkc-db
    region: singapore
    plan: starter
    databaseName: mkc_db
    user: mkc_user
