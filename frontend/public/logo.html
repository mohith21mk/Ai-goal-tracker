        const cssWidth = Math.min(window.innerWidth, maxSize);
        const cssHeight = Math.min(window.innerHeight, maxSize);

        const dpr = Math.max(1, window.devicePixelRatio || 1);

        canvas.style.width = `${cssWidth}px`;
        canvas.style.height = `${cssHeight}px`;

        canvas.width = Math.max(1, Math.round(cssWidth * dpr));
        canvas.height = Math.max(1, Math.round(cssHeight * dpr));

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cssWidth, cssHeight);

        const scale = Math.min(
            cssWidth / img.naturalWidth,
            cssHeight / img.naturalHeight
        );

        const width = img.naturalWidth * scale;
        const height = img.naturalHeight * scale;

        const x = (cssWidth - width) / 2;
        const y = (cssHeight - height) / 2;

        ctx.drawImage(img, x, y, width, height);
    }

    img.onload = resizeAndDraw;

    img.onerror = () => {
        console.error("MKC logo image failed to load.");
    };

    img.src = `data:image/png;base64,${data}`;

    window.addEventListener("resize", resizeAndDraw, { passive: true });
})();
</script>
