    <radialGradient id="star"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="45%" stop-color="#EDF7FF"/><stop offset="100%" stop-color="#59AAFF"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#00132D" flood-opacity="0.75"/></filter>
  </defs>

