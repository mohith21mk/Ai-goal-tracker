      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="16%" stop-color="#EAF4FF"/>
      <stop offset="34%" stop-color="#61B3FF"/><stop offset="52%" stop-color="#1673EA"/>
      <stop offset="76%" stop-color="#0D4FB9"/><stop offset="100%" stop-color="#061D42"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="28%" stop-color="#F8FBFF"/>
      <stop offset="52%" stop-color="#DCEBFF"/><stop offset="74%" stop-color="#74BAFF"/>
      <stop offset="100%" stop-color="#2378E5"/>
