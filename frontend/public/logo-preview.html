<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKC Logo Preview</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        width: 100vw;
        min-height: 100vh;
        background: #020817;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        color: #fff;
        padding: 2rem;
    }
    .logo-card {
        background: radial-gradient(circle at 50% 30%, rgba(20, 113, 232, 0.15), transparent 70%), #030b1e;
        border: 1px solid rgba(56, 200, 255, 0.2);
        box-shadow: 0 0 50px rgba(13, 79, 185, 0.3);
        border-radius: 24px;
        padding: 2.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 600px;
        width: 100%;
    }
    .logo-container {
        width: 100%;
        max-width: 420px;
        aspect-ratio: 1;
    }
    h1 {
        margin-top: 1.5rem;
        font-size: 1.4rem;
        letter-spacing: 0.1em;
        background: linear-gradient(135deg, #ffffff, #74BAFF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
    }
    p {
        color: #74BAFF;
        opacity: 0.8;
        font-size: 0.9rem;
        margin-top: 0.5rem;
    }
</style>
</head>
<body>
  <div class="logo-card">
    <div class="logo-container">
      <img src="./mkc-logo.svg" alt="Mastery Key Coach (MKC) Logo" style="width: 100%; height: 100%; object-fit: contain;" />
    </div>
    <h1>Mastery Key Coach</h1>
    <p>Official Vector Anchor Logo</p>
  </div>
</body>
</html>
