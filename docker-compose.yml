version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mkc_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mkc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mkc_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-mkc_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mkc_user} -d ${POSTGRES_DB:-mkc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mkc_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mkc_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-mkc_user}:${POSTGRES_PASSWORD:-mkc_secure_password}@postgres:5432/${POSTGRES_DB:-mkc_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_secure_random_64_char_secret_key}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mkc_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
